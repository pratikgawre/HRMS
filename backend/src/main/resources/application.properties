server.port=${SERVER_PORT:8080}
spring.mongodb.uri=mongodb://localhost:27017/hrmsdb
spring.mongodb.database=hrmsdb
spring.data.mongodb.auto-index-creation=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
app.mail.from=${SMTP_FROM:${spring.mail.username:}}
app.mail.provider=${MAIL_PROVIDER:smtp}
sendgrid.api-key=${SENDGRID_API_KEY:}
sendgrid.from=${SENDGRID_FROM:${SMTP_FROM:${spring.mail.username:}}}
sendgrid.from-name=${SENDGRID_FROM_NAME:Kavya HRMS}
sendgrid.api-url=${SENDGRID_API_URL:https://api.sendgrid.com/v3/mail/send}
sendgrid.timeout-ms=${SENDGRID_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLED:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLED:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:${SMTP_TIMEOUT_MS:5000}}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT_MS:${SMTP_TIMEOUT_MS:5000}}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:${SMTP_TIMEOUT_MS:5000}}
