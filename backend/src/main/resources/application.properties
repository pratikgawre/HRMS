server.port=8080
spring.data.mongodb.uri=mongodb://localhost:27017/hrmsdb
spring.data.mongodb.auto-index-creation=true

# Brevo transactional SMTP defaults.
# Values can come from backend/.env or OS environment variables.
# SMTP_FROM should be a Brevo verified sender address.
spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
