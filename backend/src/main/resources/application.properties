server.port=${SERVER_PORT:8080}
spring.mongodb.uri=mongodb://localhost:27017/hrmsdb
spring.mongodb.database=hrmsdb
spring.data.mongodb.auto-index-creation=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
app.mail.from=${SMTP_FROM:${spring.mail.username:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:${SMTP_TIMEOUT_MS:5000}}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT_MS:${SMTP_TIMEOUT_MS:5000}}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:${SMTP_TIMEOUT_MS:5000}}
